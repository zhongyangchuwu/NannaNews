stages:
  - verify
  - image
  - pages

python-checks:
  stage: verify
  image: python:3.12.11-slim-bookworm
  variables:
    NANNA_DATA_DIR: "$CI_PROJECT_DIR/.ci-data"
    NANNA_MODEL_BASE_URL: ""
    NANNA_MODEL_API_KEY: ""
    NANNA_COLLECTION_ENABLED: "false"
    PYTHONDONTWRITEBYTECODE: "1"
  script:
    - unset NANNA_MODEL_API_KEY NANNA_MODEL_BASE_URL
    - export NANNA_COLLECTION_ENABLED=false
    - apt-get update && apt-get install -y --no-install-recommends libcairo2
    - python -m pip install '.[test]'
    - python -m compileall -q src/nannanews
    - python -m pytest -q

reader-checks:
  stage: verify
  image: node:24-bookworm-slim
  script:
    - unset NANNA_MODEL_API_KEY NANNA_MODEL_BASE_URL
    - export NANNA_COLLECTION_ENABLED=false
    - cd reader
    - npm ci
    - npm test
    - npm run check

# Build without starting the application or running acquisition/model code.
# NJU's dind runner provides isolated Docker; ordinary runners deny RootlessKit.
.image-build:
  stage: image
  tags: [dind]
  image: docker:29-cli
  services:
    - name: docker:29-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2375"
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    PIP_INDEX_URL: https://pypi.org/simple
  before_script:
    - unset NANNA_MODEL_API_KEY NANNA_MODEL_BASE_URL
    - export NANNA_COLLECTION_ENABLED=false
    - docker info
    - docker buildx create --driver docker-container --driver-opt image=moby/buildkit:v0.22.0 --buildkitd-config deploy/buildkitd.nju.toml --use

container-artifact:
  extends: .image-build
  script:
    - docker buildx build --file deploy/Dockerfile --secret id=pip_index_url,env=PIP_INDEX_URL --output type=oci,dest=nannanews.oci.tar .
  artifacts:
    paths:
      - nannanews.oci.tar
    expire_in: 7 days

# A Git tag is the version; push only when this project's registry credentials exist.
release-image:
  extends: .image-build
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest" && $CI_REGISTRY && $CI_REGISTRY_IMAGE'
  script:
    - set +x
    - test -n "$CI_REGISTRY_USER" && test -n "$CI_REGISTRY_PASSWORD"
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker buildx build --file deploy/Dockerfile --secret id=pip_index_url,env=PIP_INDEX_URL --tag "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}" --push .

# Opt-in static publication only. Default to reviewed facts in Git; an optional
# approved resource pack is staged by whitelist. Never read the private database.
pages:
  stage: pages
  image: node:24-bookworm-slim
  needs: [reader-checks]
  rules:
    - if: '$PUBLISH_STATIC_READER == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - unset NANNA_MODEL_API_KEY NANNA_MODEL_BASE_URL
    - export NANNA_COLLECTION_ENABLED=false
    - cd reader
    - npm ci
    - |
      if [ -n "${STATIC_READER_DATA_SOURCE:-}" ]; then
        npm run stage:data -- "$STATIC_READER_DATA_SOURCE"
      fi
    - npm run build
    - cd ..
    - mv reader/dist public
  pages: true
  artifacts:
    paths:
      - public
    expire_in: 30 days

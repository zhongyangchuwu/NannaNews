{% extends 'base.html' %}
{% block title %}修改密码 | {{ site_name|default('南哪小报') }}{% endblock %}
{% block content %}
<section class="editor-page"><header class="page-header"><div><p class="eyebrow">账号安全</p><h1>修改密码</h1><p class="muted">使用当前密码确认身份，并输入两次新密码。</p></div></header><form method="post" class="panel stack" style="max-width:42rem"><div class="form-field"><label for="original-password">当前密码</label><input id="original-password" type="password" name="original_password" autocomplete="current-password" required></div><div class="form-field"><label for="new-password">新密码</label><input id="new-password" type="password" name="new_password" autocomplete="new-password" required></div><div class="form-field"><label for="confirm-password">确认新密码</label><input id="confirm-password" type="password" name="confirm_password" autocomplete="new-password" required></div><div class="article-actions"><button class="button" type="submit">更新密码</button><a class="button button-secondary" href="{{ url_for('main') }}">取消</a></div></form></section>
{% endblock %}

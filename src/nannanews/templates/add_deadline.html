{% extends 'base.html' %}
{% block title %}添加截止日期消息 | {{ site_name|default('南哪小报') }}{% endblock %}
{% block content %}
<section class="editor-page"><header class="page-header"><div><p class="eyebrow">提交消息</p><h1>添加截止日期消息</h1><p class="muted">用于仅有报名或申请截止日期的活动。</p></div></header><form method="post" class="panel stack" style="max-width:52rem"><div class="form-field"><label for="link">原文链接（可选）</label><input type="url" id="link" name="link" inputmode="url"></div><div class="form-field"><label for="short-title">消息标题</label><input type="text" id="short-title" name="short_title" required></div><fieldset class="form-field"><legend>类别</legend><div class="form-grid">{% for value in ['校级活动','院级活动','社团活动','讲座','招聘升学宣讲'] %}<label><input type="radio" name="tag" value="{{ value }}"> {{ value }}</label>{% endfor %}<label><input type="radio" name="tag" value="" checked> 未分类</label></div></fieldset><div class="form-grid"><div class="form-field"><label for="publish-time">刊载日期</label><input type="date" id="publish-time" name="publish_time" value="{{ today }}"></div><div class="form-field"><label for="due-time">截止日期</label><input type="date" id="due-time" name="due_time" value="{{ today }}"></div></div><div class="article-actions"><button class="button" type="submit">添加消息</button><a class="button button-secondary" href="{{ url_for('main') }}">取消</a></div></form></section>
{% endblock %}

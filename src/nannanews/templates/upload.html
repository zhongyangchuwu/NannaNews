{% extends 'base.html' %}
{% block title %}手动录入消息 | {{ site_name|default('南哪小报') }}{% endblock %}
{% block content %}
<section class="editor-page"><header class="page-header"><div><p class="eyebrow">提交消息</p><h1>手动录入</h1><p class="muted">保存后进入编辑流程，仍需完成审核和人工批准。</p></div><a class="button button-secondary" href="{{ url_for('main') }}">返回工作台</a></header>
<form method="post" class="panel stack" style="max-width:68rem"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-field"><label for="title">标题</label><input type="text" id="title" name="title" required></div>
<div class="grid-two"><fieldset class="form-field"><legend>截止日期</legend><label><input type="checkbox" id="toggleDeadline" onchange="toggleDeadlineFunc(this)"> 此消息有报名或申请截止日期</label><div id="deadlineField" hidden><label for="due-time">截止日期</label><input type="date" id="due-time" name="due_time"><button type="button" class="button button-quiet" onclick="document.getElementById('due-time').value=''">清除日期</button></div><div id="shortTitleField" hidden><label for="short-title">截止列表短标题</label><input type="text" id="short-title" name="short_title" placeholder="默认使用标题"></div></fieldset>
<div class="form-field"><label for="typeSelect">刊载板块</label><select name="entry_type" id="typeSelect" onchange="CheckType(this)"><option value="活动预告">活动预告</option><option value="参考消息">参考消息</option><option value="DDLOnly">仅截止日期</option><option value="others">自定义</option></select><input type="text" name="customType" id="customType" hidden placeholder="自定义板块名称"></div></div>
<div class="form-field"><label for="description">描述</label><textarea id="description" name="description" rows="10" required></textarea></div><div class="form-field"><label for="priority">优先级（数字越大越靠前）</label><input type="number" id="priority" name="priority" value="0" step="1"></div>
<fieldset class="form-field"><legend>消息类别</legend><div class="form-grid">{% for value in ['校级活动','院级活动','社团活动','讲座','招聘升学宣讲'] %}<label><input type="radio" name="tag" value="{{ value }}"> {{ value }}</label>{% endfor %}<label><input type="radio" name="tag" value="" checked> 未分类</label></div></fieldset><div class="article-actions" style="justify-content:flex-start"><button class="button" type="submit">保存为待处理消息</button><a class="button button-secondary" href="{{ url_for('main') }}">取消</a></div></form></section>
{% endblock %}
{% block scripts %}<script>
function toggleDeadlineFunc(checkbox){const deadline=document.getElementById('deadlineField'),shortTitle=document.getElementById('shortTitleField'),due=document.getElementById('due-time');deadline.hidden=!checkbox.checked;shortTitle.hidden=!checkbox.checked;if(checkbox.checked&&!due.value){const now=new Date();due.value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;}if(!checkbox.checked){due.value='';document.getElementById('short-title').value='';}}
function CheckType(select){const custom=document.getElementById('customType');const isCustom=select.value==='others';custom.hidden=!isCustom;custom.required=isCustom;custom.name=isCustom?'entry_type':'customType';select.name=isCustom?'':'entry_type';}
</script>{% endblock %}

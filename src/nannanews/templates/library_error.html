{% extends 'base.html' %}
{% block title %}信息库请求未完成{% endblock %}
{% block content %}<section class="empty-state notice-error" role="alert"><h1>请求未完成（{{ error.code }}）</h1><p>{{ error.description }}</p>{% if error.code == 401 %}<a class="button" href="{{ url_for('login') }}">登录后阅读</a>{% else %}<a class="button button-secondary" href="{{ url_for('information_reader.index') }}">返回信息库并调整筛选</a>{% endif %}</section>{% endblock %}
